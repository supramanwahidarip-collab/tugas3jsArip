<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Deklarasi variabel
        let nama = "Arip";
        let umur = 18;
        let is_siswa = true;

        // Menampilkan isi variabel
        console.log(`Nama     : ${nama}`);
        console.log(`Umur     : ${umur} tahun`);
        console.log(`Status   : ${is_siswa ? 'Siswa' : 'Bukan Siswa'}`);

        // 1. Deklarasi awal dengan let
        let nilai = 70;

        // 2. Tampilkan nilai awal
        console.log("Nilai Awal:", nilai);

        // 3. Ubah nilai menjadi 85 tanpa menulis 'let' lagi
        nilai = 85;

        // 4. Tampilkan nilai baru
        console.log("Nilai Baru:", nilai);
    </script>
</body>
</html>
